<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erikova nová hra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #87ceeb;
    font-family: "Titillium Web", sans-serif;
  }

  canvas {
    display: block;
  }

  /* Zaměřovací křížek uprostřed obrazovky */
  #krizek {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 20px;
    height: 20px;
    margin: -10px 0 0 -10px;
    pointer-events: none;
  }

  #krizek::before,
  #krizek::after {
    content: "";
    position: absolute;
    background: rgba(255, 255, 255, 0.9);
  }

  #krizek::before {
    left: 9px;
    width: 2px;
    height: 20px;
  }

  #krizek::after {
    top: 9px;
    width: 20px;
    height: 2px;
  }

  #start {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    cursor: pointer;
    text-align: center;
  }

  #start h1 {
    margin: 0 0 8px;
    font-size: 56px;
    text-shadow: 0 4px 0 #000;
  }

  #start p {
    margin: 4px 0;
    font-size: 20px;
  }

  .skryte {
    display: none !important;
  }
</style>
</head>
<body>
  <div id="krizek"></div>
  <div id="start">
    <h1>Erikova nová hra</h1>
    <p><b>Klikni</b> a hraj</p>
    <p>Myš = rozhlížení · WASD = chůze · Mezerník = skok · Esc = pauza</p>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // ---------- Svět ----------

  const POLOMER_OSTROVA = 11;    // ostrov je kulatý, 22 kroků napříč
  const VYSKA_OCI = 1.6;
  const RYCHLOST = 4.5;          // kroků za sekundu
  const SILA_SKOKU = 7;
  const GRAVITACE = 20;

  const scena = new THREE.Scene();
  scena.background = new THREE.Color(0x87ceeb);
  scena.fog = new THREE.Fog(0x87ceeb, 30, 90);

  const kamera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 200);
  const vykreslovac = new THREE.WebGLRenderer({ antialias: true });
  vykreslovac.setPixelRatio(devicePixelRatio);
  vykreslovac.setSize(innerWidth, innerHeight);
  document.body.prepend(vykreslovac.domElement);

  scena.add(new THREE.HemisphereLight(0xffffff, 0x556644, 0.75));
  const slunce = new THREE.DirectionalLight(0xffffff, 0.6);
  slunce.position.set(10, 20, 6);
  scena.add(slunce);

  function material(barva) {
    return new THREE.MeshLambertMaterial({ color: barva });
  }

  function pridej(geometrie, mat, x, y, z) {
    const vec = new THREE.Mesh(geometrie, mat);
    vec.position.set(x, y, z);
    scena.add(vec);
    return vec;
  }

  // ---------- Kulatý lítací ostrov ----------
  // Nahoře tráva, pod ní vrstva hlíny a dolů se ostrov zužuje do špičky.

  const materialTravy = material(0x5f9f35);
  const materialHliny = material(0x86603f);
  const materialKamene = material(0x7a6a58);

  pridej(new THREE.CylinderGeometry(POLOMER_OSTROVA, POLOMER_OSTROVA, 0.5, 64), materialTravy, 0, -0.25, 0);
  pridej(new THREE.CylinderGeometry(POLOMER_OSTROVA, POLOMER_OSTROVA * 0.92, 1.2, 64), materialHliny, 0, -1.1, 0);
  const spicka = pridej(new THREE.ConeGeometry(POLOMER_OSTROVA * 0.92, 10, 64), materialHliny, 0, -6.7, 0);
  spicka.rotation.x = Math.PI;

  // Pár kamenů trčících ze spodku, ať ostrov nevypadá moc hladce
  for (let i = 0; i < 10; i++) {
    const uhel = Math.random() * Math.PI * 2;
    const hloubka = 2 + Math.random() * 6;
    const vzdalenost = POLOMER_OSTROVA * 0.92 * (1 - (hloubka - 1.7) / 10) * 0.9;
    pridej(new THREE.SphereGeometry(0.8 + Math.random() * 1.2, 16, 12), materialKamene,
      Math.cos(uhel) * vzdalenost, -hloubka, Math.sin(uhel) * vzdalenost);
  }

  // ---------- Plot dokola ----------

  const materialDreva = material(0xa27c4b);
  const POLOMER_PLOTU = POLOMER_OSTROVA - 0.4;
  const POCET_SLOUPKU = 56;
  const sloupek = new THREE.CylinderGeometry(0.1, 0.12, 1.3, 12);

  const sloupky = [];
  for (let i = 0; i < POCET_SLOUPKU; i++) {
    const uhel = (i / POCET_SLOUPKU) * Math.PI * 2;
    const x = Math.cos(uhel) * POLOMER_PLOTU;
    const z = Math.sin(uhel) * POLOMER_PLOTU;
    pridej(sloupek, materialDreva, x, 0.65, z);
    sloupky.push(new THREE.Vector3(x, 0, z));
  }

  // Dvě kulatá bidla mezi každými dvěma sloupky
  for (let i = 0; i < POCET_SLOUPKU; i++) {
    const a = sloupky[i];
    const b = sloupky[(i + 1) % POCET_SLOUPKU];
    const bidlo = new THREE.CylinderGeometry(0.06, 0.06, a.distanceTo(b), 8);
    bidlo.rotateX(Math.PI / 2);
    for (const vyska of [0.45, 1.0]) {
      const kus = pridej(bidlo, materialDreva, (a.x + b.x) / 2, vyska, (a.z + b.z) / 2);
      kus.lookAt(b.x, vyska, b.z);
    }
  }

  // ---------- Stromy ----------

  const materialKmene = material(0x68502f);
  const barvyListi = [0x3a8028, 0x4a9a30, 0x327022];
  const stromy = [];   // místa kmenů, přes které se nedá projít
  const POLOMER_KMENE = 0.35;

  // Strom: kulatý kmen a koruna z několika koulí
  function pridejStrom(x, z) {
    const vyskaKmene = 3.5 + Math.random() * 1.5;
    pridej(new THREE.CylinderGeometry(0.25, POLOMER_KMENE, vyskaKmene, 16), materialKmene, x, vyskaKmene / 2, z);

    const koruna = [[0, 0.6, 0, 1.8], [0.9, 0, 0.3, 1.3], [-0.8, 0.1, -0.4, 1.3], [0.2, 0.1, -1, 1.2], [-0.3, 1.5, 0.3, 1.2]];
    for (const [dx, dy, dz, polomer] of koruna) {
      const barva = barvyListi[Math.floor(Math.random() * barvyListi.length)];
      pridej(new THREE.SphereGeometry(polomer, 20, 16), material(barva), x + dx, vyskaKmene + dy, z + dz);
    }
    stromy.push({ x, z });
  }

  // Stromy se rozmístí náhodně, ne moc blízko plotu, hráče ani sebe navzájem
  const pocetStromu = 7;
  for (let pokus = 0; stromy.length < pocetStromu && pokus < 500; pokus++) {
    const uhel = Math.random() * Math.PI * 2;
    const vzdalenost = Math.sqrt(Math.random()) * (POLOMER_OSTROVA - 3);
    const x = Math.cos(uhel) * vzdalenost;
    const z = Math.sin(uhel) * vzdalenost;
    if (Math.hypot(x, z - 2) < 4) continue;
    if (stromy.some((s) => Math.hypot(s.x - x, s.z - z) < 5)) continue;
    pridejStrom(x, z);
  }

  // ---------- Mraky z nafouknutých koulí ----------

  const materialMraku = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.92 });
  const mraky = [];
  for (let i = 0; i < 16; i++) {
    const mrak = new THREE.Group();
    const pocetKouli = 4 + Math.floor(Math.random() * 4);
    for (let k = 0; k < pocetKouli; k++) {
      const koule = new THREE.Mesh(new THREE.SphereGeometry(1.2 + Math.random() * 1.3, 16, 12), materialMraku);
      koule.position.set(k * 1.6 - pocetKouli * 0.8, Math.random() * 0.8, (Math.random() - 0.5) * 2);
      mrak.add(koule);
    }
    mrak.scale.y = 0.6;
    const uhel = Math.random() * Math.PI * 2;
    const vzdalenost = 20 + Math.random() * 45;
    mrak.position.set(Math.cos(uhel) * vzdalenost, -8 + Math.random() * 24, Math.sin(uhel) * vzdalenost);
    scena.add(mrak);
    mraky.push(mrak);
  }

  // ---------- Hráč ----------

  const hrac = { x: 0, y: 0, z: 2, rychlostY: 0, naZemi: true };
  let otoceni = Math.PI;   // doleva/doprava
  let naklon = -0.15;      // nahoru/dolů
  const drzeneKlavesy = {};

  const start = document.getElementById("start");
  start.addEventListener("click", () => vykreslovac.domElement.requestPointerLock());

  document.addEventListener("pointerlockchange", () => {
    start.classList.toggle("skryte", document.pointerLockElement === vykreslovac.domElement);
  });

  document.addEventListener("mousemove", (e) => {
    if (document.pointerLockElement !== vykreslovac.domElement) return;
    otoceni -= e.movementX * 0.0025;
    naklon -= e.movementY * 0.0025;
    naklon = Math.max(-1.5, Math.min(1.5, naklon));
  });

  document.addEventListener("keydown", (e) => {
    drzeneKlavesy[e.code] = true;
    if (e.code === "Space" && hrac.naZemi) {
      hrac.rychlostY = SILA_SKOKU;
      hrac.naZemi = false;
    }
  });
  document.addEventListener("keyup", (e) => { drzeneKlavesy[e.code] = false; });

  function pohniHracem(dt) {
    let dopredu = 0;
    let doboku = 0;
    if (drzeneKlavesy.KeyW) dopredu += 1;
    if (drzeneKlavesy.KeyS) dopredu -= 1;
    if (drzeneKlavesy.KeyD) doboku += 1;
    if (drzeneKlavesy.KeyA) doboku -= 1;

    const delka = Math.hypot(dopredu, doboku) || 1;
    const sin = Math.sin(otoceni);
    const cos = Math.cos(otoceni);
    hrac.x += ((-sin * dopredu) + (cos * doboku)) / delka * RYCHLOST * dt;
    hrac.z += ((-cos * dopredu) - (sin * doboku)) / delka * RYCHLOST * dt;

    // Kmenem stromu se nedá projít: hráče odsune ven z kmene
    for (const strom of stromy) {
      const dx = hrac.x - strom.x;
      const dz = hrac.z - strom.z;
      const vzdalenost = Math.hypot(dx, dz) || 0.001;
      const minimum = POLOMER_KMENE + 0.3;
      if (vzdalenost < minimum && hrac.y < 4) {
        hrac.x = strom.x + dx / vzdalenost * minimum;
        hrac.z = strom.z + dz / vzdalenost * minimum;
      }
    }

    // Kulatý plot nepustí hráče z ostrova
    const hranice = POLOMER_PLOTU - 0.4;
    const odStredu = Math.hypot(hrac.x, hrac.z);
    if (odStredu > hranice) {
      hrac.x *= hranice / odStredu;
      hrac.z *= hranice / odStredu;
    }

    hrac.rychlostY -= GRAVITACE * dt;
    hrac.y += hrac.rychlostY * dt;
    if (hrac.y <= 0) {
      hrac.y = 0;
      hrac.rychlostY = 0;
      hrac.naZemi = true;
    }
  }

  // ---------- Hlavní smyčka ----------

  let minule = performance.now();

  function snimek(ted) {
    const dt = Math.min((ted - minule) / 1000, 0.05);
    minule = ted;

    if (document.pointerLockElement === vykreslovac.domElement) pohniHracem(dt);

    for (const mrak of mraky) {
      mrak.position.x += dt * 0.6;
      if (mrak.position.x > 70) mrak.position.x = -70;
    }

    kamera.position.set(hrac.x, hrac.y + VYSKA_OCI, hrac.z);
    kamera.rotation.set(naklon, otoceni, 0, "YXZ");
    vykreslovac.render(scena, kamera);
    requestAnimationFrame(snimek);
  }

  requestAnimationFrame(snimek);

  addEventListener("resize", () => {
    kamera.aspect = innerWidth / innerHeight;
    kamera.updateProjectionMatrix();
    vykreslovac.setSize(innerWidth, innerHeight);
  });
</script>
</body>
</html>

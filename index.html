<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erikova hra</title>
<style>
  :root {
    --velikost: 19;
    --drevo: #dcb35c;
    --drevo-tmave: #c99a3e;
    --cara: #5a3d12;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #2e2a24;
    font-family: sans-serif;
    color: #f3e9d2;
  }

  h1 {
    margin: 6px 0;
    font-size: 24px;
  }

  #mapa {
    display: grid;
    grid-template-columns: repeat(var(--velikost), 1fr);
    gap: 2px;
    padding: 2px;
    background: var(--cara);
    border: 6px solid var(--drevo-tmave);
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    /* Deska je vždycky čtvercová a vejde se do okna */
    width: min(97vw, calc(100vh - 60px));
    aspect-ratio: 1;
  }

  .policko {
    background: var(--drevo);
    cursor: pointer;
  }

  .policko:hover {
    background: #f0cf85;
  }
</style>
</head>
<body>
  <h1>Erikova hra</h1>
  <div id="mapa"></div>

<script>
  const VELIKOST = 19;
  const mapa = document.getElementById("mapa");

  for (let radek = 0; radek < VELIKOST; radek++) {
    for (let sloupec = 0; sloupec < VELIKOST; sloupec++) {
      const policko = document.createElement("div");
      policko.className = "policko";
      policko.dataset.radek = radek;
      policko.dataset.sloupec = sloupec;
      mapa.appendChild(policko);
    }
  }
</script>
</body>
</html>
